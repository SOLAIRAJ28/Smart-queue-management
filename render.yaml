services:
  # 1. Express Backend Web Service
  - type: web
    name: smart-queue-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # User will input this on Render dashboard
      - key: JWT_SECRET
        generateValue: true # Securely auto-generated by Render
      - key: JWT_REFRESH_SECRET
        generateValue: true # Securely auto-generated by Render

  # 2. Vite React Frontend Static Site
  - type: web
    name: smart-queue-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-queue-backend
          property: url
